// ====================== HÀM HỖ TRỢ ======================
function matchSon(dataStr, targetSon) {
  if (!dataStr || !targetSon) return false;
  var tokens = dataStr.toString().split(/[\s,]+/).map(function (t) { return t.trim(); }).filter(Boolean);
  for (var i = 0; i < tokens.length; i++) {
    var token = tokens[i];
    if (token === targetSon) return true;
    if (quaiToSon[token] && quaiToSon[token].indexOf(targetSon) !== -1) return true;
  }
  return false;
}

function getSons(huong) {
  return phuongToSon[huong] ? phuongToSon[huong] : [huong];
}

// Tạo các thẻ tag (tránh lồng template literal)
function tagsHtml(arr, cls, prefix) {
  return arr.map(function (x) {
    return '<span class="tag ' + cls + '">' + (prefix || '') + x + '</span>';
  }).join('');
}

  var nguyen = document.getElementById("nguyenSelect").value;
  if (!huong) { alert("Vui lòng chọn Phương hoặc Sơn!"); return; }

  // ===== Tiết Khí (tùy chọn, cần tietkhi_core.js) =====
  var dateInput = document.getElementById("dateInput").value;
  var tkBox = document.getElementById("tietKhiBox");
  tkBox.style.display = "none";
  if (dateInput && typeof getTietKhi === "function") {
    try {
      var tk = getTietKhi(new Date(dateInput));
      var tkName = (tk && tk.name) ? tk.name : tk;
      tkBox.innerHTML = "<strong>Tiết Khí hiện tại:</strong> " + tkName +
        ((tk && tk.start) ? " (từ " + tk.start + ")" : "");
      tkBox.style.display = "block";
    } catch (e) {
      tkBox.style.display = "none";
    }
  }

  var html = "<p><strong>Năm:</strong> " + d.name +
    " &nbsp;|&nbsp; <strong>Đối tượng:</strong> " + huong + " (" + sons.join(" - ") + ")" +
    (thang > 0 ? " &nbsp;|&nbsp; <strong>Tháng:</strong> " + thangNames[thang] : "") +
    " &nbsp;|&nbsp; <strong>Nguyên:</strong> " + nguyen + "</p>";

  var nk = (d.hung && d.hung.khaiSonHung && d.hung.khaiSonHung["Niên khắc sơn gia"]) || "Không có dữ liệu";
  html += '<div class="nien-khac-banner"><strong>📌 Niên Khắc Sơn Gia năm ' + d.name + ':</strong> ' + nk + '</div>';

  // ===== PHÂN TÍCH THEO MỘT SƠN =====
  function analyzeSon(son) {
    var r = {
      khaiSon: { cat: [], hung: [] },
      lapHuong: { cat: [], hung: [] },
      tuPhuong: { cat: [], hung: [] },
      chung: { cat: [], hung: [], info: [] }
    };
    var k, v, e;

    // --- CÁT NĂM ---
    for (k in (d.cat || {})) if (matchSon(d.cat[k], son)) r.chung.cat.push(k);
    for (k in (d.caiSonHoangDao || {})) if (matchSon(d.caiSonHoangDao[k], son)) r.chung.cat.push("[Hoàng Đạo] " + k);

    for (k in (d.thongThienKhieu || {})) {
      if (matchSon(d.thongThienKhieu[k], son)) {
        r.chung.cat.push("[Thông Thiên] " + k);
        if (k.indexOf("12 cát sơn") !== -1) r.chung.info.push("✓ Sơn này nằm trong 12 cát sơn nên dùng (năm/tháng/ngày/giờ)");
      }
    }
    for (k in (d.tauMaLucNham || {})) {
      if (matchSon(d.tauMaLucNham[k], son)) {
        r.chung.cat.push("[Tẩu Mã] " + k);
        if (k.indexOf("12 cát sơn") !== -1) r.chung.info.push("✓ Sơn này nằm trong 12 cát sơn Tẩu Mã Lục Nhâm");
      }
    }
    for (k in (d.tuLoiTamNguyen || {})) if (matchSon(d.tuLoiTamNguyen[k], son)) r.chung.cat.push("[Tứ Lợi] " + k);

    if (d.tamNguyenTuBach && d.tamNguyenTuBach[nguyen]) {
      e = d.tamNguyenTuBach[nguyen];
      for (k in e) if (matchSon(e[k], son)) r.chung.cat.push("[Tử Bạch " + nguyen + "] " + k);
    }

    // --- HUNG NĂM ---
    var h = d.hung || {};
    for (k in (h.chung || {})) if (matchSon(h.chung[k], son)) r.chung.hung.push(k);
    for (k in (h.khaiSonHung || {})) if (matchSon(h.khaiSonHung[k], son)) r.khaiSon.hung.push(k);
    for (k in (h.lapHuongHung || {})) if (matchSon(h.lapHuongHung[k], son)) r.lapHuong.hung.push(k);
    for (k in (h.tuPhuongHung || {})) if (matchSon(h.tuPhuongHung[k], son)) r.tuPhuong.hung.push(k);

    // --- THÁNG ---
    if (thang >= 1 && thang <= 12) {
      var idx = thang - 1;
      var suffix = " (T. " + thangNames[thang] + ")";
      if (d.thangCat) {
        for (k in d.thangCat) {
          var arr = d.thangCat[k];
          if (Array.isArray(arr) && arr[idx] && matchSon(arr[idx], son)) r.chung.cat.push(k + suffix);
        }
      }
      if (d.khaiSonHungThang) {
        for (k in d.khaiSonHungThang) {
          var a1 = d.khaiSonHungThang[k];
          if (Array.isArray(a1) && a1[idx] && matchSon(a1[idx], son)) r.khaiSon.hung.push(k + suffix);
        }
      }
      if (d.tuPhuongHungThang) {
        for (k in d.tuPhuongHungThang) {
          var a2 = d.tuPhuongHungThang[k];
          if (Array.isArray(a2) && a2[idx] && matchSon(a2[idx], son)) r.tuPhuong.hung.push(k + suffix);
        }
      }
    }
    return r;
  }

  function block(cls, title, obj, hungLabel) {
    return '<div class="section-box ' + cls + '"><h4>🔹 ' + title + '</h4>' +
      '<div>' + (obj.cat.length ? tagsHtml(obj.cat, "tag-cat") : "<span class='note'>Không có cát đặc biệt</span>") + '</div>' +
      '<div style="margin-top:6px">' + (obj.hung.length ? tagsHtml(obj.hung, "tag-hung", "⛔ ") : "<span class='good'>✓ Không phạm hung " + hungLabel + "</span>") + '</div></div>';
  }

  sons.forEach(function (son) {
    var r = analyzeSon(son);
    html += '<div class="section-box"><h3>Sơn / Phương: <strong>' + son + '</strong></h3>';
    html += block("ks", "Khai Sơn", r.khaiSon, "Khai Sơn");
    html += block("lh", "Lập Hướng", r.lapHuong, "Lập Hướng");
    html += block("tp", "Tu Phương", r.tuPhuong, "Tu Phương");
    html += '<div style="margin-top:10px"><strong>Cát chung / Tử Bạch / Hoàng Đạo / Thông Thiên / Tẩu Mã / Tứ Lợi:</strong><br>' +
      (r.chung.cat.length ? tagsHtml(r.chung.cat, "tag-cat") : "<span class='note'>Không có</span>") +
      (r.chung.info.length ? "<br>" + tagsHtml(r.chung.info, "tag-info") : "") +
      (r.chung.hung.length ? "<br><strong>Hung chung:</strong> " + tagsHtml(r.chung.hung, "tag-hung", "⛔ ") : "") +
      '</div></div>';
  });

  document.getElementById("analysisContent").innerHTML = html;
  var box = document.getElementById("analysisResult");
  box.style.display = "block";
  box.scrollIntoView({ behavior: "smooth" });
}

// ====================== RENDER DATA GỐC ======================
function renderYearData(yearKey) {
  var d = yearData[yearKey];
  if (!d) return;
  document.getElementById("currentYearName").textContent = d.name;
  if (d.status === "input here") {
    document.getElementById("yearMeta").textContent = "";
    document.getElementById("detailDataContainer").innerHTML =
      '<div class="empty-notice">⏳ Năm <strong>' + d.name + '</strong> đang chờ nhập liệu.</div>';
    return;
  }
  document.getElementById("yearMeta").textContent = d.meta || "";
  document.getElementById("detailDataContainer").innerHTML =
    "<p class='note'>Dữ liệu chi tiết đã được load. Sử dụng form phía trên để phân tích.</p>";
}

// ====================== KHỞI TẠO ======================
function initYearDropdown() {
  var select = document.getElementById("yearSelect");
  select.innerHTML = "";
  Object.keys(yearData).forEach(function (key) {
    var val = yearData[key];
    var opt = document.createElement("option");
    opt.value = key;
    opt.textContent = val.status === "input here" ? val.name + " (Chưa có data)" : val.name + " ✓";
    select.appendChild(opt);
  });
}

initYearDropdown();
document.getElementById("yearSelect").value = "BinhThan";
renderYearData("BinhThan");
</script>
</body>
</html>
