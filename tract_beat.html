<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Karaoke Word Timing Extractor (x:yzt)</title>
  <!-- Thư viện OCR Tesseract.js chạy trực tiếp trên trình duyệt -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #eee; margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: auto; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; }
    .card { background: #1e1e1e; padding: 18px; border-radius: 10px; border: 1px solid #333; }
    h2, h3 { margin-top: 0; color: #4ade80; }
    button { background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #444; cursor: not-allowed; }
    button.success { background: #16a34a; }
    select, textarea, input[type="color"], input[type="number"] {
      width: 100%; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 8px; box-sizing: border-box; margin-top: 6px;
    }
    textarea { height: 150px; font-size: 14px; line-height: 1.5; }
    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    .video-box { position: relative; background: #000; border-radius: 8px; overflow: hidden; margin-top: 10px; }
    video { width: 100%; display: block; }
    #overlayCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #log { background: #0d0d0d; color: #a3e635; font-family: monospace; padding: 10px; height: 90px; overflow-y: auto; border-radius: 6px; font-size: 12px; margin-top: 10px; }
    #output { height: 340px; font-family: monospace; font-size: 14px; color: #38bdf8; }
    label { font-size: 13px; color: #bbb; display: block; margin-top: 8px; }
  </style>
</head>
<body>

<div class="container">
  <!-- CỘT TRÁI: NẠP DỮ LIỆU & CẤU HÌNH -->
  <div class="card">
    <h2>1. Nạp Beat & Lời Bài Hát</h2>
    
    <div class="row">
      <button id="btnPickFolder">📂 Chọn Thư Mục Video</button>
      <select id="videoSelect" disabled>
        <option value="">-- Chưa chọn thư mục --</option>
      </select>
    </div>

    <div class="video-box">
      <video id="videoPlayer" controls muted></video>
      <canvas id="overlayCanvas"></canvas>
    </div>

    <div class="row" style="margin-top: 10px;">
      <div style="flex:1">
        <label>Màu chữ ĐÃ HÁT (màu chạy):</label>
        <input type="color" id="activeColor" value="#00ff00">
      </div>
      <div style="flex:1">
        <label>Vùng quét chữ từ trên xuống (%):</label>
        <input type="number" id="roiTop" value="65" min="0" max="90">
      </div>
      <div style="flex:1">
        <label>Bước nhảy quét (giây):</label>
        <input type="number" id="stepSec" value="0.1" step="0.05" min="0.05" max="0.5">
      </div>
    </div>

    <label>2. Nhập Lyrics chuẩn (từng câu y như trên video):</label>
    <textarea id="lyricsInput" placeholder="Ví dụ:&#10;Xuân đã đến rồi gieo rắc ngàn hồn hoa xuống đời&#10;Vui trong bình minh muôn loài chim hót vang mọi nơi..."></textarea>

    <div class="row" style="margin-top: 12px;">
      <button id="btnStart" class="success" disabled>▶ Bắt Đầu Quét & Xuất Time</button>
      <button id="btnStop" disabled style="background:#dc2626;">⏹ Dừng</button>
    </div>

    <div id="log">Sẵn sàng. Hãy bấm "Chọn Thư Mục Video"...</div>
  </div>

  <!-- CỘT PHẢI: KẾT QUẢ XUẤT RA -->
  <div class="card">
    <h2>3. Kết Quả Time Từng Chữ (x:yzt)</h2>
    <p style="font-size: 13px; color: #aaa; margin-top: -8px;">
      Định dạng: <b>x</b> (giờ) : <b>yz</b> (giây) <b>t</b> (phần lẻ 1/10 giây). Ví dụ: 6.8s &rarr; <code>0:068</code>
    </p>
    <textarea id="output" readonly placeholder="Kết quả sẽ hiển thị tại đây..."></textarea>
    <div class="row" style="margin-top: 10px;">
      <button id="btnCopy">📋 Copy Kết Quả</button>
      <button id="btnDownload">💾 Tải File .TXT</button>
    </div>
  </div>
</div>

<!-- Canvas ẩn để xử lý pixel -->
<canvas id="workCanvas" style="display:none;"></canvas>

<script>
  const btnPickFolder = document.getElementById('btnPickFolder');
  const videoSelect = document.getElementById('videoSelect');
  const video = document.getElementById('videoPlayer');
  const overlayCanvas = document.getElementById('overlayCanvas');
  const workCanvas = document.getElementById('workCanvas');
  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  const logBox = document.getElementById('log');
  const outputBox = document.getElementById('output');

  let videoFiles = [];
  let isScanning = false;

  function log(msg) {
    logBox.innerHTML += `<div>> ${msg}</div>`;
    logBox.scrollTop = logBox.scrollHeight;
  }

  // Chuyển đổi số giây sang định dạng x:yzt theo yêu cầu của bạn
  function formatTimeXYZT(seconds) {
    const hrs = Math.floor(seconds / 3600);
    const remSec = seconds % 3600;
    const wholeSec = Math.floor(remSec);
    const tenth = Math.floor((remSec - wholeSec) * 10);
    const secStr = wholeSec < 10 ? `0${wholeSec}` : `${wholeSec}`;
    // Nếu dưới 1 phút hoặc tính tổng giây trong giờ:
    return `${hrs}:${secStr}${tenth}`;
  }

  // Chuyển mã Hex sang RGB
  function hexToRgb(hex) {
    const num = parseInt(hex.replace('#', ''), 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }

  // Tính khoảng cách màu Euclidean
  function colorDistance(c1, c2) {
    return Math.sqrt((c1.r - c2.r)**2 + (c1.g - c2.g)**2 + (c1.b - c2.b)**2);
  }

  // 1. Truy cập thư mục video trên máy tính
  btnPickFolder.addEventListener('click', async () => {
    try {
      const dirHandle = await window.showDirectoryPicker();
      videoFiles = [];
      videoSelect.innerHTML = '<option value="">-- Chọn file beat karaoke --</option>';

      for await (const entry of dirHandle.values()) {
        if (entry.kind === 'file' && /\.(mp4|webm|mkv|mov|avi)$/i.test(entry.name)) {
          const file = await entry.getFile();
          videoFiles.push(file);
          const opt = document.createElement('option');
          opt.value = videoFiles.length - 1;
          opt.textContent = file.name;
          videoSelect.appendChild(opt);
        }
      }

      if (videoFiles.length > 0) {
        videoSelect.disabled = false;
        log(`Đã tìm thấy ${videoFiles.length} video trong thư mục.`);
      } else {
        log('Không tìm thấy file video nào trong thư mục này.');
      }
    } catch (err) {
      log('Đã hủy chọn thư mục hoặc trình duyệt không hỗ trợ.');
    }
  });

  // Nạp video được chọn vào trình phát
  videoSelect.addEventListener('change', () => {
    const idx = videoSelect.value;
    if (idx === '') return;
    const file = videoFiles[idx];
    video.src = URL.createObjectURL(file);
    video.onloadedmetadata = () => {
      overlayCanvas.width = video.videoWidth;
      overlayCanvas.height = video.videoHeight;
      workCanvas.width = video.videoWidth;
      workCanvas.height = video.videoHeight;
      btnStart.disabled = false;
      log(`Đã nạp: ${file.name} (${video.duration.toFixed(1)}s)`);
    };
  });

  // Hàm tua video chính xác đến mốc thời gian t
  function seekTo(time) {
    return new Promise(resolve => {
      video.currentTime = time;
      video.onseeked = () => resolve();
    });
  }

  // Chuẩn hóa từ để so khớp
  function cleanWord(w) {
    return w.toLowerCase().replace(/[.,!?;"'()]/g, '').trim();
  }

  // 2. Quy trình quét chính
  btnStart.addEventListener('click', async () => {
    const rawLyrics = document.getElementById('lyricsInput').value.trim();
    if (!rawLyrics) {
      alert('Vui lòng nhập lời bài hát trước khi quét!');
      return;
    }

    // Tách lời bài hát thành danh sách câu và từng từ
    const lines = rawLyrics.split('\n').map(l => l.trim()).filter(Boolean);
    const targetWords = [];
    lines.forEach((line, lineIdx) => {
      line.split(/\s+/).forEach(w => {
        targetWords.push({
          text: w,
          clean: cleanWord(w),
          lineIdx: lineIdx,
          time: null,
          bbox: null
        });
      });
    });

    isScanning = true;
    btnStart.disabled = true;
    btnStop.disabled = false;
    outputBox.value = '';

    const step = parseFloat(document.getElementById('stepSec').value) || 0.1;
    const roiTopRatio = (parseFloat(document.getElementById('roiTop').value) || 65) / 100;
    const targetColor = hexToRgb(document.getElementById('activeColor').value);

    const wCtx = workCanvas.getContext('2d', { willReadFrequently: true });
    const oCtx = overlayCanvas.getContext('2d');

    log('Đang khởi tạo bộ nhận diện chữ tiếng Việt (Tesseract OCR)...');
    const worker = await Tesseract.createWorker('vie');
    log('Bắt đầu quét video...');

    let currentWordIdx = 0;
    let lastOcrTime = -99;
    let activeBBoxes = []; // Lưu tọa độ các chữ đang hiển thị trên màn hình

    for (let t = 0; t < video.duration && isScanning && currentWordIdx < targetWords.length; t += step) {
      await seekTo(t);

      const W = workCanvas.width;
      const H = workCanvas.height;
      const roiY = Math.floor(H * roiTopRatio);
      const roiH = H - roiY;

      wCtx.drawImage(video, 0, 0, W, H);

      // Vẽ khung vùng quét lên preview
      oCtx.clearRect(0, 0, W, H);
      oCtx.strokeStyle = 'rgba(255, 255, 0, 0.5)';
      oCtx.lineWidth = 3;
      oCtx.strokeRect(0, roiY, W, roiH);

      // Chạy OCR mỗi 1.2 giây để cập nhật tọa độ các chữ mới xuất hiện trên màn hình
      if (t - lastOcrTime >= 1.2) {
        lastOcrTime = t;
        // Cắt riêng vùng chứa chữ để OCR chạy cực nhanh
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = W;
        cropCanvas.height = roiH;
        cropCanvas.getContext('2d').drawImage(workCanvas, 0, roiY, W, roiH, 0, 0, W, roiH);

        const { data } = await worker.recognize(cropCanvas);
        activeBBoxes = data.words.map(w => ({
          clean: cleanWord(w.text),
          x: w.bbox.x0,
          y: w.bbox.y0 + roiY,
          w: w.bbox.x1 - w.bbox.x0,
          h: w.bbox.y1 - w.bbox.y0
        }));
      }

      // Khớp tọa độ cho các từ tiếp theo chưa có thời gian
      for (let i = currentWordIdx; i < Math.min(currentWordIdx + 12, targetWords.length); i++) {
        const tw = targetWords[i];
        const match = activeBBoxes.find(b => b.clean === tw.clean && b.w > 5);
        if (match) {
          tw.bbox = match;
        }
      }

      // Kiểm tra sự đổi màu bên trong khung tọa độ của từ hiện tại
      const currTarget = targetWords[currentWordIdx];
      if (currTarget && currTarget.bbox) {
        const b = currTarget.bbox;
        oCtx.strokeStyle = '#00ff00';
        oCtx.strokeRect(b.x, b.y, b.w, b.h);

        const imgData = wCtx.getImageData(b.x, b.y, b.w, b.h).data;
        let matchedPixels = 0;
        const totalPixels = imgData.length / 4;

        for (let p = 0; p < imgData.length; p += 4) {
          const dist = colorDistance({ r: imgData[p], g: imgData[p+1], b: imgData[p+2] }, targetColor);
          if (dist < 95) matchedPixels++; // Ngưỡng sai lệch màu
        }

        // Nếu > 15% điểm ảnh trong chữ đã đổi sang màu chạy karaoke -> Chốt mốc time!
        if (matchedPixels / totalPixels > 0.15) {
          currTarget.time = formatTimeXYZT(t);
          outputBox.value += `${currTarget.text} (${currTarget.time})  `;
          
          // Xuống dòng nếu hết câu
          if (currentWordIdx + 1 < targetWords.length && targetWords[currentWordIdx + 1].lineIdx !== currTarget.lineIdx) {
            outputBox.value += '\n';
          }
          currentWordIdx++;
        }
      }
    }

    await worker.terminate();
    isScanning = false;
    btnStart.disabled = false;
    btnStop.disabled = true;
    log(`Hoàn tất! Đã bắt được ${currentWordIdx}/${targetWords.length} chữ.`);
  });

  btnStop.addEventListener('click', () => {
    isScanning = false;
    log('Đã dừng quét theo yêu cầu.');
  });

  document.getElementById('btnCopy').addEventListener('click', () => {
    outputBox.select();
    document.execCommand('copy');
    log('Đã copy kết quả vào bộ nhớ tạm.');
  });

  document.getElementById('btnDownload').addEventListener('click', () => {
    const blob = new Blob([outputBox.value], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'karaoke_timing.txt';
    a.click();
  });
</script>
</body>
</html>
