<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra Cứu Niên Biểu</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 16px; background: #f4f6f9; margin: 0; }
  .card { background: white; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
  select, button { padding: 10px 12px; font-size: 15px; border-radius: 8px; border: 1px solid #ccc; width: 100%; margin-top: 4px; }
  button { background: #0d6efd; color: white; border: none; font-weight: 600; margin-top: 12px; }
  .tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 13px; margin: 3px 2px; font-weight: 600; }
  .tag-cat { background: #d1e7dd; color: #146c2e; }
  .tag-hung { background: #f8d7da; color: #b02a37; }
  h2 { margin: 0 0 12px 0; font-size: 1.2rem; }
  .result { display: none; }
  label { font-weight: 600; font-size: 14px; }
</style>
</head>
<body>

<div class="card">
  <h2>Tra Cứu Niên Biểu</h2>

  <label>1. Chọn Năm:</label>
  <select id="yearSelect"></select>

  <label style="margin-top:12px; display:block;">2. Chọn Phương / Sơn:</label>
  <select id="huongSelect">
    <option value="">-- Chọn phương hoặc sơn --</option>
    <optgroup label="8 Phương">
      <option value="Bắc">Bắc (Khảm)</option>
      <option value="Đông Bắc">Đông Bắc (Cấn)</option>
      <option value="Đông">Đông (Chấn)</option>
      <option value="Đông Nam">Đông Nam (Tốn)</option>
      <option value="Nam">Nam (Ly)</option>
      <option value="Tây Nam">Tây Nam (Khôn)</option>
      <option value="Tây">Tây (Đoài)</option>
      <option value="Tây Bắc">Tây Bắc (Càn)</option>
    </optgroup>
    <optgroup label="24 Sơn">
      <option value="Nhâm">Nhâm</option><option value="Tý">Tý</option><option value="Quý">Quý</option>
      <option value="Sửu">Sửu</option><option value="Cấn">Cấn</option><option value="Dần">Dần</option>
      <option value="Giáp">Giáp</option><option value="Mão">Mão</option><option value="Ất">Ất</option>
      <option value="Thìn">Thìn</option><option value="Tốn">Tốn</option><option value="Tỵ">Tỵ</option>
      <option value="Bính">Bính</option><option value="Ngọ">Ngọ</option><option value="Đinh">Đinh</option>
      <option value="Mùi">Mùi</option><option value="Khôn">Khôn</option><option value="Thân">Thân</option>
      <option value="Canh">Canh</option><option value="Dậu">Dậu</option><option value="Tân">Tân</option>
      <option value="Tuất">Tuất</option><option value="Càn">Càn</option><option value="Hợi">Hợi</option>
    </optgroup>
  </select>

  <button onclick="traCuu()">Phân Tích & Tra Cứu</button>
</div>

<div id="resultBox" class="card result">
  <h2>Kết quả</h2>
  <div id="resultContent"></div>
</div>

<script>
const yearData = {
  BinhThan: {
    name: "Bính Thân",
    meta: "Can: Hỏa - Chi: Kim - Nạp âm thuộc: Hỏa",
    cat: {
      "Tuế đức": "Bính",
      "Tuế đức hợp": "Tân",
      "Tuế chi đức": "Sửu",
      "Dương quý nhân": "Dậu",
      "Âm quý nhân": "Hợi",
      "Tuế Lộc": "Tỵ",
      "Tuế Mã": "Dần",
      "Tấu thư": "Khôn",
      "Bác sĩ": "Cấn"
    },
    caiSonHoangDao: {
      "Tham lang": "Khôn Ất",
      "Cự Môn": "Khảm Quý Thân Thìn",
      "Vũ khúc": "Càn Giáp",
      "Văn khúc": "Chấn Canh Hợi Mùi"
    },
    thongThienKhieu: {
      "Trước phương tam hợp": "Cấn Dần Giáp Mão Ất Thìn",
      "Sau phương tam hợp": "Khôn Thân Canh Dậu Tân Tuất",
      "12 cát sơn nên dùng năm, tháng, ngày, giờ": "Thân Tý Thìn Dần Ngọ Tuất"
    },
    tauMaLucNham: {
      "Thần hậu": "Ất Thìn",
      "Công tào": "Bính Ngọ",
      "Thiên cương": "Khôn Thân",
      "Thắng quang": "Tân Tuất",
      "Truyền tổng": "Nhâm Tý",
      "Hà khôi": "Cấn Dần",
      "12 cát sơn nên dùng năm, tháng, ngày, giờ": "Thân Tý Thìn Dần Ngọ Tuất"
    },
    tuLoiTamNguyen: {
      "Thái dương": "Dậu",
      "Thái âm": "Hợi",
      "Long đức": "Mão",
      "Phúc đức": "Tỵ"
    },
    hung: {
      chung: {
        "Thái tuế": "Thân",
        "Tuế phá": "Dần",
        "Tam sát": "Tỵ Ngọ Mùi",
        "Tọa sát hướng sát": "Bính Đinh Nhâm Quý",
        "Phù thiên không vong": "Tốn Tân"
      },
      khaiSonHung: {
        "Niên khắc sơn gia": "Chấn Cấn Tỵ sơn",
        "Âm phủ Thái tuế": "Khảm Khôn",
        "Lục hại": "Hợi",
        "Tử phủ": "Sửu",
        "Cứu thoái": "Mão"
      },
      lapHuongHung: {
        "Tuần sơn La hầu": "Canh Mùi",
        "Bệnh phủ": "Mùi"
      },
      tuPhuongHung: {
        "Thiên quan phù": "Hợi",
        "Địa quan phù": "Tý",
        "Đại sát": "Tý",
        "Đại tướng quân": "Ngọ",
        "Lực sĩ": "Càn",
        "Tàm Thất": "Tốn",
        "Tàm quan": "Thìn",
        "Tàm mệnh": "Tỵ",
        "Tuế hình": "Dần",
        "Hoàng phan": "Thìn",
        "Cẩu vĩ": "Tuất",
        "Phi liêm": "Thìn",
        "Tang môn": "Tuất",
        "Điếu khách": "Ngọ",
        "Bạch hổ": "Thìn",
        "Kim thần": "Dần Mão Ngọ Mùi Tý Sửu",
        "Độc hỏa": "Ly",
        "Ngũ quỷ": "Thân",
        "Phá bại ngũ quỷ": "Khôn"
      }
    }
  },

  BinhNgo: { name: "Bính Ngọ", status: "input here" },
  DinhMui: { name: "Đinh Mùi", status: "input here" },
  TanMao:  { name: "Tân Mão",  status: "input here" }
};

const phuongToSon = {
  "Bắc": ["Nhâm", "Tý", "Quý"],
  "Đông Bắc": ["Sửu", "Cấn", "Dần"],
  "Đông": ["Giáp", "Mão", "Ất"],
  "Đông Nam": ["Thìn", "Tốn", "Tỵ"],
  "Nam": ["Bính", "Ngọ", "Đinh"],
  "Tây Nam": ["Mùi", "Khôn", "Thân"],
  "Tây": ["Canh", "Dậu", "Tân"],
  "Tây Bắc": ["Tuất", "Càn", "Hợi"]
};

function matchSon(str, son) {
  if (!str) return false;
  return str.split(/[\s,]+/).some(function(t) { return t === son; });
}

function getSons(huong) {
  return phuongToSon[huong] || [huong];
}

function initYearDropdown() {
  var select = document.getElementById("yearSelect");
  select.innerHTML = "";
  for (var key in yearData) {
    var val = yearData[key];
    var opt = document.createElement("option");
    opt.value = key;
    opt.textContent = val.status === "input here" ? val.name + " (Chưa có data)" : val.name + " ✓";
    select.appendChild(opt);
  }
}

function traCuu() {
  var yearKey = document.getElementById("yearSelect").value;
  var d = yearData[yearKey];
  var huong = document.getElementById("huongSelect").value;

  if (!huong) {
    alert("Vui lòng chọn Phương hoặc Sơn!");
    return;
  }

  if (d.status === "input here") {
    alert("Năm " + d.name + " chưa có dữ liệu!");
    return;
  }

  var sons = getSons(huong);
  var html = "<p><b>Năm:</b> " + d.name + " | <b>Đối tượng:</b> " + huong + " (" + sons.join(" - ") + ")</p>";

  sons.forEach(function(son) {
    var cats = [];
    var hungs = [];

    // Cát
    for (var k in d.cat) {
      if (matchSon(d.cat[k], son)) cats.push(k);
    }
    for (var k in d.caiSonHoangDao) {
      if (matchSon(d.caiSonHoangDao[k], son)) cats.push("[Hoàng Đạo] " + k);
    }
    for (var k in d.thongThienKhieu) {
      if (matchSon(d.thongThienKhieu[k], son)) cats.push("[Thông Thiên] " + k);
    }
    for (var k in d.tauMaLucNham) {
      if (matchSon(d.tauMaLucNham[k], son)) cats.push("[Tẩu Mã] " + k);
    }
    for (var k in d.tuLoiTamNguyen) {
      if (matchSon(d.tuLoiTamNguyen[k], son)) cats.push("[Tứ Lợi] " + k);
    }

    // Hung
    for (var k in d.hung.chung) {
      if (matchSon(d.hung.chung[k], son)) hungs.push(k);
    }
    for (var k in d.hung.khaiSonHung) {
      if (matchSon(d.hung.khaiSonHung[k], son)) hungs.push("[Khai Sơn] " + k);
    }
    for (var k in d.hung.lapHuongHung) {
      if (matchSon(d.hung.lapHuongHung[k], son)) hungs.push("[Lập Hướng] " + k);
    }
    for (var k in d.hung.tuPhuongHung) {
      if (matchSon(d.hung.tuPhuongHung[k], son)) hungs.push("[Tu Phương] " + k);
    }

    html += '<div style="border:1px solid #ddd; border-radius:8px; padding:12px; margin:12px 0; background:#fafafa;">';
    html += '<h3 style="margin:0 0 8px 0;">Sơn: <span style="color:#0d6efd">' + son + '</span></h3>';
    html += '<div><b>Cát:</b> ' + (cats.length ? cats.map(function(c){return '<span class="tag tag-cat">'+c+'</span>';}).join('') : '<i>Không có</i>') + '</div>';
    html += '<div style="margin-top:8px"><b>Hung:</b> ' + (hungs.length ? hungs.map(function(h){return '<span class="tag tag-hung">⛔ '+h+'</span>';}).join('') : '<span style="color:green">✓ Không phạm hung</span>') + '</div>';
    html += '</div>';
  });

  document.getElementById("resultContent").innerHTML = html;
  document.getElementById("resultBox").style.display = "block";
}

// Chạy khi load trang
initYearDropdown();
</script>
</body>
</html>
