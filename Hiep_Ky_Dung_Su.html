  .tag-warn { background: #fef3c7; color: var(--warn); border: 1px solid #f59e0b; }
  .tag-info { background: #e0f2fe; color: #0369a1; }
  .result-box { border: 2px solid var(--primary); display: none; }

// ====================== HÀM HỖ TRỢ ======================
function matchSon(dataStr, targetSon) {
  if (!dataStr || !targetSon) return false;
  const tokens = dataStr.toString().split(/[\s,]+/).map(t => t.trim()).filter(Boolean);
  for (let token of tokens) {
    if (token === targetSon) return true;
    if (quaiToSon[token] && quaiToSon[token].includes(targetSon)) return true;
  }
  return false;
}

function getSons(huong) {
  return phuongToSon[huong] ? phuongToSon[huong] : [huong];
}

// ====================== TRA CỨU NÂNG CAO ======================
function traCuu() {
  const yearKey = document.getElementById("yearSelect").value;
  const d = yearData[yearKey];

  if (!d || d.status === "input here") {
    alert(`Năm \( {d ? d.name : ""} hiện chưa có dữ liệu.\nHãy tìm key " \){yearKey}" trong code và paste data vào.`);
    return;
  }

  const huong = document.getElementById("huongSelect").value;
  const thang = parseInt(document.getElementById("thangSelect").value);
  const nguyen = document.getElementById("nguyenSelect").value;

  if (!huong) {
    alert("Vui lòng chọn Phương hoặc Sơn!");
    return;
  }

  const sons = getSons(huong);
  const thangNames = ["","Giêng","Hai","Ba","Tư","Năm","Sáu","Bảy","Tám","Chín","Mười","Một","Chạp"];

  // ===== Tiết Khí =====
  const dateInput = document.getElementById("dateInput").value;
  const tietKhiBox = document.getElementById("tietKhiBox");
  if (dateInput && typeof getTietKhi === "function") {
    try {
      const tk = getTietKhi(new Date(dateInput));
      if (tk) {
        tietKhiBox.style.display = "block";
        tietKhiBox.innerHTML = `<strong>Tiết Khí:</strong> \( {tk.name} ( \){tk.type}) 
          ${tk.next ? `→ Tiếp theo: ${tk.next.name}` : ""}`;
      } else {
        tietKhiBox.style.display = "none";
      }
    } catch (e) {
      tietKhiBox.style.display = "none";
    }
  } else {
    tietKhiBox.style.display = "none";
  }

  let html = `<p><strong>Năm:</strong> ${d.name} &nbsp;|&nbsp; 
    <strong>Đối tượng:</strong> \( {huong} ( \){sons.join(" - ")}) 
    ${thang > 0 ? `&nbsp;|&nbsp; <strong>Tháng:</strong> ${thangNames[thang]}` : ""} 
    &nbsp;|&nbsp; <strong>Nguyên:</strong> ${nguyen}</p>`;

  // Banner Niên khắc
  const nk = d.hung?.khaiSonHung?.["Niên khắc sơn gia"] || "Không có dữ liệu";
  html += `<div class="nien-khac-banner"><strong>📌 Niên Khắc Sơn Gia năm ${d.name}:</strong> ${nk}</div>`;

  // Phân tích từng sơn
  sons.forEach(son => {
    const result = {
      khaiSon: { cat: [], hung: [] },
      lapHuong: { cat: [], hung: [] },
      tuPhuong: { cat: [], hung: [] },
      chung: { cat: [], hung: [], info: [] }
    };

    // --- CÁT ---
    for (const [k, v] of Object.entries(d.cat || {})) {
      if (matchSon(v, son)) result.chung.cat.push(k);
    }
    for (const [k, v] of Object.entries(d.caiSonHoangDao || {})) {
      if (matchSon(v, son)) result.chung.cat.push(`[Hoàng Đạo] ${k}`);
    }
    for (const [k, v] of Object.entries(d.thongThienKhieu || {})) {
      if (matchSon(v, son)) {
        result.chung.cat.push(`[Thông Thiên] ${k}`);
        if (k.includes("12 cát sơn")) result.chung.info.push("✓ Nằm trong 12 cát sơn (năm/tháng/ngày/giờ)");
      }
    }
    for (const [k, v] of Object.entries(d.tauMaLucNham || {})) {
      if (matchSon(v, son)) {
        result.chung.cat.push(`[Tẩu Mã] ${k}`);
        if (k.includes("12 cát sơn")) result.chung.info.push("✓ Nằm trong 12 cát sơn Tẩu Mã Lục Nhâm");
      }
    }
    for (const [k, v] of Object.entries(d.tuLoiTamNguyen || {})) {
      if (matchSon(v, son)) result.chung.cat.push(`[Tứ Lợi] ${k}`);
    }

    // Tam Nguyên Tử Bạch
    if (d.tamNguyenTuBach && d.tamNguyenTuBach[nguyen]) {
      for (const [k, v] of Object.entries(d.tamNguyenTuBach[nguyen])) {
        if (matchSon(v, son)) result.chung.cat.push(`[Tử Bạch ${nguyen}] ${k}`);
      }
    }

    // --- HUNG ---
    for (const [k, v] of Object.entries(d.hung?.chung || {})) {
      if (matchSon(v, son)) result.chung.hung.push(k);
    }
    for (const [k, v] of Object.entries(d.hung?.khaiSonHung || {})) {
      if (matchSon(v, son)) result.khaiSon.hung.push(k);
    }
    for (const [k, v] of Object.entries(d.hung?.lapHuongHung || {})) {
      if (matchSon(v, son)) result.lapHuong.hung.push(k);
    }
    for (const [k, v] of Object.entries(d.hung?.tuPhuongHung || {})) {
      if (matchSon(v, son)) result.tuPhuong.hung.push(k);
    }

    // Render
    html += `<div class="section-box">
      <h3>Sơn / Phương: <strong>${son}</strong></h3>

      <div class="section-box ks">
        <h4>🔹 Khai Sơn</h4>
        <div>\( {result.khaiSon.cat.length ? result.khaiSon.cat.map(c => `<span class="tag tag-cat"> \){c}</span>`).join("") : "<span class='note'>Không có cát đặc biệt</span>"}</div>
        <div style="margin-top:6px">${result.khaiSon.hung.length ? result.khaiSon.hung.map(h => `<span class="tag tag-hung">⛔ ${h}</span>`).join("") : "<span class='good'>✓ Không phạm hung Khai Sơn</span>"}</div>
      </div>

      <div class="section-box lh">
        <h4>🔹 Lập Hướng</h4>
        <div>\( {result.lapHuong.cat.length ? result.lapHuong.cat.map(c => `<span class="tag tag-cat"> \){c}</span>`).join("") : "<span class='note'>Không có cát đặc biệt</span>"}</div>
        <div style="margin-top:6px">${result.lapHuong.hung.length ? result.lapHuong.hung.map(h => `<span class="tag tag-hung">⛔ ${h}</span>`).join("") : "<span class='good'>✓ Không phạm hung Lập Hướng</span>"}</div>
      </div>

      <div class="section-box tp">
        <h4>🔹 Tu Phương</h4>
        <div>\( {result.tuPhuong.cat.length ? result.tuPhuong.cat.map(c => `<span class="tag tag-cat"> \){c}</span>`).join("") : "<span class='note'>Không có cát đặc biệt</span>"}</div>
        <div style="margin-top:6px">${result.tuPhuong.hung.length ? result.tuPhuong.hung.map(h => `<span class="tag tag-hung">⛔ ${h}</span>`).join("") : "<span class='good'>✓ Không phạm hung Tu Phương</span>"}</div>
      </div>

      <div style="margin-top:10px">
        <strong>Cát chung / Tử Bạch / Hoàng Đạo / Thông Thiên / Tẩu Mã / Tứ Lợi:</strong><br>
        \( {result.chung.cat.length ? result.chung.cat.map(c => `<span class="tag tag-cat"> \){c}</span>`).join("") : "<span class='note'>Không có</span>"}
        \( {result.chung.info.length ? "<br>" + result.chung.info.map(i => `<span class="tag tag-info"> \){i}</span>`).join("") : ""}
        ${result.chung.hung.length ? "<br><strong>Hung chung:</strong> " + result.chung.hung.map(h => `<span class="tag tag-hung">⛔ ${h}</span>`).join("") : ""}
      </div>
    </div>`;
  });

  document.getElementById("analysisContent").innerHTML = html;
  document.getElementById("analysisResult").style.display = "block";
  document.getElementById("analysisResult").scrollIntoView({ behavior: "smooth" });
}

// ====================== RENDER DATA GỐC ======================
function renderYearData(yearKey) {
  const d = yearData[yearKey];
  if (!d) return;
  document.getElementById("currentYearName").textContent = d.name;

  if (d.status === "input here") {
    document.getElementById("yearMeta").textContent = "";
    document.getElementById("detailDataContainer").innerHTML = `
      <div class="empty-notice">
        ⏳ Năm <strong>${d.name}</strong> đang chờ nhập liệu.<br>
        Hãy tìm dòng <code>\( {yearKey}: { name: " \){d.name}", status: "input here" }</code> trong code và paste data vào.
      </div>`;
    return;
  }

  document.getElementById("yearMeta").textContent = d.meta || "";
  document.getElementById("detailDataContainer").innerHTML = `<p class="note">Dữ liệu năm ${d.name} đã được load. Sử dụng form phía trên để phân tích chi tiết.</p>`;
}

// ====================== KHỞI TẠO ======================
function initYearDropdown() {
  const select = document.getElementById("yearSelect");
  select.innerHTML = "";
  for (const [key, val] of Object.entries(yearData)) {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = val.status === "input here" ? `\( {val.name} (Chưa có data)` : ` \){val.name} ✓`;
    select.appendChild(opt);
  }
}

initYearDropdown();
renderYearData("BinhThan");
</script>

</html>
