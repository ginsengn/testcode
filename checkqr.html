<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kính Lúp Soi Mã QR v2 - Giải Mã Chuyên Sâu</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #0f172a;
      --accent: #2563eb;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --warn: #d97706;
      --warn-bg: #fffbeb;
      --safe: #16a34a;
      --safe-bg: #f0fdf4;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; }
    .container { max-width: 680px; margin: 0 auto; }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.35rem; color: var(--primary); margin-bottom: 4px; }
    .header p { font-size: 0.88rem; color: var(--muted); }

    .upload-box {
      background: var(--card);
      border: 2px dashed #94a3b8;
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 16px;
      display: block;
    }
    .upload-box:hover { border-color: var(--accent); background: #f8fafc; }
    .upload-btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
    .upload-hint { font-size: 0.82rem; color: var(--muted); }
    input[type="file"] { display: none; }

    #preview-container { display: none; text-align: center; margin-bottom: 16px; }
    #preview-img { max-width: 100%; max-height: 240px; border-radius: 8px; border: 1px solid var(--border); }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
      margin-bottom: 16px;
      display: none;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .badge-bank { background: #dbeafe; color: #1e40af; }
    .badge-url { background: #fef3c7; color: #92400e; }
    .badge-text { background: #f1f5f9; color: #334155; }
    .badge-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid #fecaca; }

    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 14px;
      border-left: 4px solid;
    }
    .alert-danger { background: var(--danger-bg); border-color: var(--danger); color: #991b1b; }
    .alert-warn { background: var(--warn-bg); border-color: var(--warn); color: #92400e; }
    .alert-safe { background: var(--safe-bg); border-color: var(--safe); color: #166534; }

    .info-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
    .info-table td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 0.92rem; }
    .info-table td:first-child { width: 36%; color: var(--muted); font-weight: 500; }
    .info-table td:last-child { font-weight: 600; word-break: break-word; }

    .money-highlight {
      font-size: 1.35rem;
      color: var(--danger);
      font-weight: 800;
      background: var(--danger-bg);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .raw-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.84rem;
      color: #334155;
      word-break: break-all;
      margin-top: 6px;
    }

    .copy-btn {
      margin-top: 8px;
      background: #e2e8f0;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--primary);
    }
    .copy-btn:active { background: #cbd5e1; }
    .engine-tag { font-size: 0.75rem; color: var(--muted); float: right; margin-top: 4px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🔍 Kính Lúp Soi Dữ Liệu Mã QR (v2)</h1>
    <p>Hỗ trợ mã QR mật độ cao (MoMo, Ngân hàng) & Mã vạch — Xử lý 100% nội bộ</p>
  </div>

  <label class="upload-box" for="file-input">
    <div class="upload-btn">📂 Chọn ảnh QR từ bộ nhớ / Chụp ảnh</div>
    <div class="upload-hint">Hỗ trợ ảnh chụp màn hình sắc nét, QR mật độ cao & Barcode</div>
    <input type="file" id="file-input" accept="image/*">
  </label>

  <div id="preview-container">
    <img id="preview-img" alt="Ảnh mã QR đang kiểm tra">
  </div>

  <canvas id="qr-canvas" style="display:none;"></canvas>
  <div id="result-card" class="card"></div>
</div>

<script>
  const BANK_BINS = {
    "970436": "Vietcombank (VCB)", "970415": "VietinBank", "970418": "BIDV",
    "970405": "Agribank", "970407": "Techcombank", "970422": "MB Bank (Quân Đội)",
    "970432": "VPBank", "970416": "ACB (Á Châu)", "970423": "TPBank",
    "970403": "Sacombank", "970441": "VIB (Quốc Tế)", "970437": "HDBank",
    "970443": "SHB", "970426": "MSB (Hàng Hải)", "970448": "OCB (Phương Đông)",
    "970431": "Eximbank", "970428": "Nam A Bank", "970454": "VietCapital Bank (BVBank)",
    "970429": "SCB", "970449": "LPBank (Lộc Phát)", "970414": "OceanBank",
    "970439": "Public Bank", "970424": "Shinhan Bank", "970452": "KienlongBank",
    "970438": "BaoViet Bank", "970446": "Co-opBank", "970458": "UOB Vietnam",
    "422589": "CIMB Bank", "970462": "Kookmin Bank", "970467": "KEB Hana Bank",
    "971005": "Viettel Money", "971011": "VNPT Money", "546034": "CAKE by VPBank",
    "546035": "Ubank by VPBank", "963388": "Timo by Ban Viet Bank"
  };

  const fileInput = document.getElementById('file-input');
  const previewContainer = document.getElementById('preview-container');
  const previewImg = document.getElementById('preview-img');
  const canvas = document.getElementById('qr-canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const resultCard = document.getElementById('result-card');

  // Hàm quét bằng jsQR ở nhiều tỷ lệ khác nhau để bắt được cả QR siêu dày đặc lẫn QR quá to
  function scanWithJsQR(img) {
    const scales = [1.0, 0.75, 0.5, 1.5]; // Quét nguyên bản 100% trước để không mất chi tiết ô vuông nhỏ
    for (let scale of scales) {
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      if (w < 50 || h < 50 || w > 3500 || h > 3500) continue;

      canvas.width = w;
      canvas.height = h;
      ctx.imageSmoothingEnabled = false; // Giữ sắc nét từng pixel đen trắng
      ctx.drawImage(img, 0, 0, w, h);

      const imageData = ctx.getImageData(0, 0, w, h);
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: "attemptBoth"
      });
      if (code && code.data) {
        return { data: code.data, format: "QR_CODE", engine: `jsQR (${Math.round(scale*100)}%)` };
      }
    }
    return null;
  }

  // Hàm tổng hợp: ưu tiên bộ giải mã phần cứng Native của trình duyệt, sau đó fallback sang jsQR đa tỷ lệ
  async function decodeImage(img) {
    // 1. Thử BarcodeDetector API gốc của hệ điều hành (đọc cực tốt cả QR mật độ cao & Barcode 1D)
    if ('BarcodeDetector' in window) {
      try {
        const detector = new BarcodeDetector();
        const barcodes = await detector.detect(img);
        if (barcodes && barcodes.length > 0) {
          return {
            data: barcodes[0].rawValue,
            format: barcodes[0].format,
            engine: "Native OS Engine"
          };
        }
      } catch (err) {
        console.warn("Native BarcodeDetector bỏ qua, chuyển sang jsQR:", err);
      }
    }

    // 2. Fallback sang jsQR đa tỷ lệ
    return scanWithJsQR(img);
  }

  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = async function() {
        previewImg.src = event.target.result;
        previewContainer.style.display = 'block';

        const decoded = await decodeImage(img);
        renderAnalysis(decoded);
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  function parseTLV(str) {
    const result = {};
    let i = 0;
    while (i < str.length) {
      if (i + 4 > str.length) break;
      const tag = str.substring(i, i + 2);
      const len = parseInt(str.substring(i + 2, i + 4), 10);
      if (isNaN(len) || i + 4 + len > str.length) break;
      const val = str.substring(i + 4, i + 4 + len);
      result[tag] = val;
      i += 4 + len;
    }
    return result;
  }

  function analyzeVietQR(raw) {
    const root = parseTLV(raw);
    const info = {
      isDynamic: root["01"] === "12",
      bankBin: "",
      bankName: "Không xác định (Mã lạ)",
      accountNumber: "Không tìm thấy",
      amount: null,
      merchantName: root["59"] || "",
      purpose: ""
    };

    if (root["38"]) {
      const tag38 = parseTLV(root["38"]);
      if (tag38["01"]) {
        const sub01 = parseTLV(tag38["01"]);
        info.bankBin = sub01["00"] || "";
        info.accountNumber = sub01["01"] || "";
        info.bankName = BANK_BINS[info.bankBin] || (info.bankBin ? `Mã BIN: ${info.bankBin}` : "Không xác định");
      }
    }
    if (root["54"]) info.amount = parseFloat(root["54"]);
    if (root["62"]) {
      const tag62 = parseTLV(root["62"]);
      if (tag62["08"]) info.purpose = tag62["08"];
    }
    return info;
  }

  function formatMoney(num) {
    return num.toLocaleString('vi-VN') + " VND";
  }

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, tag => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[tag]));
  }

  function renderAnalysis(decoded) {
    resultCard.style.display = 'block';

    if (!decoded || !decoded.data) {
      resultCard.innerHTML = `
        <div class="alert alert-danger">
          <strong>❌ Không giải mã được dữ liệu trong ảnh!</strong><br>
          Mẹo: Nếu ảnh chụp màn hình quá dài (chứa nhiều nút bấm xung quanh), hãy <strong>cắt (crop) gọn vùng vuông quanh mã QR</strong> rồi chọn lại ảnh đó.
        </div>
      `;
      return;
    }

    const raw = decoded.data;
    const safeRaw = escapeHTML(raw);
    let html = `<span class="engine-tag">Bộ giải mã: ${escapeHTML(decoded.engine)} (${escapeHTML(decoded.format)})</span>`;

    // TRƯỜNG HỢP 1: MÃ CHUYỂN KHOẢN NGÂN HÀNG (VIETQR / EMVCO)
    if (raw.startsWith("000201")) {
      const qr = analyzeVietQR(raw);
      html += `<span class="badge badge-bank">🏦 Mã Chuyển Khoản Ngân Hàng (VietQR)</span>`;

      if (qr.amount !== null) {
        html += `<div class="alert alert-warn"><strong>⚠️ CẢNH BÁO SỐ TIỀN CỐ ĐỊNH (MÃ ĐỘNG):</strong><br>Mã này đã cài sẵn số tiền bên dưới. Hãy đếm kỹ từng số 0 trước khi quét bằng app ngân hàng!</div>`;
      } else {
        html += `<div class="alert alert-safe"><strong>ℹ️ Mã QR Tĩnh:</strong> Mã này không cài sẵn số tiền (bạn sẽ tự nhập số tiền trên app ngân hàng).</div>`;
      }

      html += `<table class="info-table">`;
      html += `<tr><td>Ngân hàng nhận</td><td>${escapeHTML(qr.bankName)}</td></tr>`;
      html += `<tr><td>Số tài khoản</td><td style="color:#0f172a; font-size:1.05rem;">${escapeHTML(qr.accountNumber)}</td></tr>`;
      html += qr.amount !== null
        ? `<tr><td>Số tiền cài sẵn</td><td><span class="money-highlight">${formatMoney(qr.amount)}</span></td></tr>`
        : `<tr><td>Số tiền cài sẵn</td><td>Không có (Tự nhập)</td></tr>`;
      if (qr.purpose) html += `<tr><td>Nội dung CK</td><td>${escapeHTML(qr.purpose)}</td></tr>`;
      if (qr.merchantName) html += `<tr><td>Tên định danh</td><td>${escapeHTML(qr.merchantName)}</td></tr>`;
      html += `</table>`;
    }
    // TRƯỜNG HỢP 2: ĐƯỜNG LINK (URL)
    else if (/^https?:\/\//i.test(raw) || /^www\./i.test(raw)) {
      let urlObj = null;
      try { urlObj = new URL(raw.startsWith("http") ? raw : "http://" + raw); } catch (e) {}

      const hostname = urlObj ? urlObj.hostname.toLowerCase() : "Không xác định";
      const shorteners = ["bit.ly", "tinyurl.com", "goo.gl", "t.co", "bom.so", "s.net.vn", "is.gd", "rb.gy", "cutt.ly"];
      const isShortened = shorteners.some(d => hostname === d || hostname.endsWith("." + d));
      const isDangerousFile = /\.(apk|exe|bat|msi|scr|zip|rar)(\?|$)/i.test(raw);
      const isHttpOnly = raw.toLowerCase().startsWith("http://");
      const isPunycode = hostname.includes("xn--");

      html += `<span class="badge badge-url">🌐 Đường Dẫn Website (URL)</span>`;

      if (isDangerousFile) {
        html += `<div class="alert alert-danger"><strong>🚨 NGUY HIỂM CỰC ĐỘ:</strong> Link dẫn trực tiếp tới file cài đặt phần mềm (<code>.apk/.exe</code>). Tuyệt đối không tải về!</div>`;
      } else if (isShortened) {
        html += `<div class="alert alert-warn"><strong>⚠️ CẢNH BÁO LINK RÚT GỌN:</strong> Kẻ gian thường dùng link rút gọn (<code>${escapeHTML(hostname)}</code>) để che giấu trang web lừa đảo.</div>`;
      } else if (isPunycode) {
        html += `<div class="alert alert-danger"><strong>🚨 CẢNH BÁO TÊN MIỀN GIẢ MẠO:</strong> Tên miền chứa ký tự mã hóa quốc tế (Punycode) giả dạng thương hiệu.</div>`;
      } else if (isHttpOnly) {
        html += `<div class="alert alert-warn"><strong>⚠️ KẾT NỐI KHÔNG BẢO MẬT (HTTP):</strong> Trang web này không có chứng chỉ mã hóa HTTPS.</div>`;
      } else {
        html += `<div class="alert alert-safe"><strong>🛡️ Đã vô hiệu hóa tự động mở:</strong> Hãy kiểm tra kỹ tên miền gốc bên dưới.</div>`;
      }

      html += `
        <table class="info-table">
          <tr><td>Tên miền gốc (Domain)</td><td style="color:#dc2626; font-size:1.05rem;">${escapeHTML(hostname)}</td></tr>
          <tr><td>Giao thức</td><td>${urlObj ? escapeHTML(urlObj.protocol.replace(':','').toUpperCase()) : 'Không rõ'}</td></tr>
          <tr><td>Đường dẫn chi tiết</td><td>${urlObj ? escapeHTML(urlObj.pathname + urlObj.search) : safeRaw}</td></tr>
        </table>
      `;
    }
    // TRƯỜNG HỢP 3: MÃ PHIÊN THANH TOÁN VÍ ĐIỆN TỬ (MOMO / VNPAY / ZALOPAY TOKEN)
    else if (/^(28|29|30|99)\d{14,}/.test(raw) || (raw.length >= 24 && !raw.includes(" ") && !raw.includes(":"))) {
      html += `<span class="badge badge-danger">💳 Mã Phiên Thanh Toán / Token Rút Tiền Tự Động</span>`;
      html += `
        <div class="alert alert-danger">
          <strong>🚨 CẢNH BÁO BẢO MẬT CẤP ĐỘ CAO:</strong><br>
          Đây là chuỗi <strong>Mã định danh thanh toán một lần (Payment Token)</strong> của ví điện tử (như MoMo, ZaloPay, VNPAY) hoặc mã thẻ thanh toán tại quầy thu ngân.<br>
          • <strong>Tuyệt đối KHÔNG gửi ảnh này cho người lạ</strong> khi mã còn hiệu lực (thường 60 giây), vì họ có thể dùng máy quét để trừ tiền trực tiếp từ ví của bạn mà không cần mật khẩu!
        </div>
      `;
      html += `
        <table class="info-table">
          <tr><td>Định dạng mã</td><td>${escapeHTML(decoded.format)} (Độ dài: ${raw.length} ký tự)</td></tr>
          <tr><td>Loại dữ liệu</td><td>Chuỗi Token xác thực phiên giao dịch ví điện tử</td></tr>
        </table>
      `;
    }
    // TRƯỜNG HỢP 4: CÁC ĐỊNH DẠNG KHÁC
    else {
      let typeLabel = "📄 Văn Bản Thuần / Dữ Liệu Khác";
      let warningHtml = "";

      if (/^WIFI:/i.test(raw)) {
        typeLabel = "📶 Cấu Hình Kết Nối Wi-Fi";
        warningHtml = `<div class="alert alert-warn"><strong>⚠️ Lưu ý:</strong> Mã này yêu cầu điện thoại kết nối vào mạng Wi-Fi.</div>`;
      } else if (/^(SMSTO|SMS):/i.test(raw)) {
        typeLabel = "💬 Lệnh Tự Động Soạn Tin Nhắn SMS";
        warningHtml = `<div class="alert alert-danger"><strong>🚨 CẢNH BÁO:</strong> Mã này kích hoạt gửi tin nhắn SMS (có thể gửi tới đầu số dịch vụ trừ tiền).</div>`;
      } else if (/^[a-zA-Z0-9+-]+:\/\//.test(raw)) {
        typeLabel = "📱 Lệnh Mở Ứng Dụng (Deep Link)";
        warningHtml = `<div class="alert alert-warn"><strong>⚠️ Lưu ý:</strong> Mã này gọi mở trực tiếp một ứng dụng cài trên máy.</div>`;
      }

      html += `<span class="badge badge-text">${typeLabel}</span>` + warningHtml;
    }

    html += `
      <div style="margin-top: 12px;">
        <strong style="font-size: 0.85rem; color: var(--muted);">Chuỗi dữ liệu thô nguyên bản bên trong mã:</strong>
        <div class="raw-box" id="raw-text-box">${safeRaw}</div>
        <button class="copy-btn" onclick="copyRawText()">📋 Copy chuỗi dữ liệu gốc</button>
      </div>
    `;

    resultCard.innerHTML = html;
  }

  function copyRawText() {
    const text = document.getElementById('raw-text-box').innerText;
    navigator.clipboard.writeText(text).then(() => alert("Đã copy chuỗi dữ liệu gốc!"));
  }
</script>

</body>
</html>
